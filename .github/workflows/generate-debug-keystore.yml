name: Generate Stable Debug Keystore (one-time)

# Run this ONCE, manually, from the Actions tab (Run workflow).
# It creates a persistent debug keystore with a FIXED SHA-1, prints the
# fingerprints you register in Google Cloud, and uploads the keystore so you
# can store it as the DEBUG_KEYSTORE_BASE64 secret used by build-apk.yml.
#
# The debug keystore is intentionally non-secret (standard password "android"),
# so printing its base64 here is safe. Never do this for a RELEASE keystore.

on:
  workflow_dispatch:

jobs:
  generate-keystore:
    name: Generate keystore + print SHA-1
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Create debug keystore (fixed debug conventions)
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Print SHA-1 / SHA-256 (register the SHA-1 in Google Cloud)
        run: |
          echo "==================================================================="
          echo " REGISTER THE SHA1 BELOW IN GOOGLE CLOUD -> Android OAuth client"
          echo " Package name: com.solvd.neet"
          echo "==================================================================="
          keytool -list -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -storepass android -keypass android | grep -E "SHA1|SHA256"
          echo "==================================================================="

      - name: Encode keystore to base64 (for the GitHub secret)
        run: |
          base64 -w0 debug.keystore > debug.keystore.base64.txt
          echo "Created debug.keystore.base64.txt"
          echo "Save its contents as the repo secret: DEBUG_KEYSTORE_BASE64"

      - name: Upload keystore + base64 as artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: |
            debug.keystore
            debug.keystore.base64.txt
          if-no-files-found: error
          retention-days: 7
