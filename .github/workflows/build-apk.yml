name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build-android:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to publish the APK to a GitHub Release

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      # Reuse a stable debug keystore so the APK's SHA-1 never changes between
      # builds (required for native Google Sign-In). Falls back to an ephemeral
      # keystore if the secret is not set yet, so the build still succeeds.
      - name: Restore stable debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
            echo "Restored stable debug keystore (fixed SHA-1)."
            echo "=================================================================="
            echo " THIS is the SHA-1 your APK is signed with."
            echo " It MUST match the SHA-1 in your Google Cloud Android OAuth client."
            echo "=================================================================="
            keytool -list -v \
              -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey \
              -storepass android -keypass android | grep -E "SHA1:|SHA256:"
            echo "=================================================================="
          else
            echo "WARNING: DEBUG_KEYSTORE_BASE64 secret not set."
            echo "Using an ephemeral keystore - the SHA-1 will change every build"
            echo "and native Google Sign-In will not work until you set the secret."
          fi

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Solvd-NEET-CBT-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Publish the APK to a stable GitHub Release so the landing-page Download
      # button can link straight to it. The tag "app-latest" is reused each
      # build, and the asset is overwritten, so the download URL never changes:
      #   https://github.com/<owner>/<repo>/releases/download/app-latest/solvd.apk
      - name: Publish APK to GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk solvd.apk
          gh release create app-latest \
            --title "Solvd App (latest)" \
            --notes "Latest Solvd Android build" \
            --latest || true
          gh release upload app-latest solvd.apk --clobber
